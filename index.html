<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Agustín Andrés Ibarra — Videogame Narrative Designer</title>
    <meta name="description" content="Portfolio de Agustín Andrés Ibarra, diseñador narrativo de videojuegos." />
    <link rel="icon" href="images/favicon.ico" />

    <style>
      /* =========================================================
           GENERAL
        ========================================================= */

      html,
      body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        background: #000000;
        color: #ffffff;

        font-family: Arial, Helvetica, sans-serif;

        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
      }

      body {
        cursor: default;
      }

      /* =========================================================
 LANGUAGE SELECTOR
========================================================= */

      #language-control {
        position: fixed;

        top: 20px;
        left: 24px;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 4px;

        z-index: 1000;

        touch-action: auto;
      }

      #language-control button {
        border: none;

        background: transparent;

        color: #ffffff;

        font-size: 12px;

        cursor: pointer;

        padding: 2px 0;

        opacity: 0.6;

        transition:
          opacity 0.2s ease,
          transform 0.2s ease;

        width: 100%;
        text-align: center;
      }

      #language-control button:hover {
        opacity: 1;

        transform: scale(1.15);
      }

      #current-language {
        min-width: 90px;

        text-align: center;

        font-size: 13px;

        letter-spacing: 1px;

        color: #ffffff;

        user-select: none;
      }

      /* =========================================================
   MOBILE PHONE BLOCK
========================================================= */

      #mobile-phone-block {
        display: none;

        position: fixed;
        inset: 0;

        width: 100dvw;
        height: 100dvh;

        z-index: 99999;

        box-sizing: border-box;

        background: #000;
        color: #fff;

        align-items: center;
        justify-content: center;

        text-align: center;

        padding: 30px;
      }

      #mobile-phone-content {
        width: min(88vw, 500px);

        display: flex;
        flex-direction: column;

        align-items: center;
      }

      .mobile-phone-title {
        font-size: 0.85rem;

        letter-spacing: 0.18em;

        text-transform: uppercase;

        opacity: 0.55;

        margin-bottom: 18px;
      }

      .mobile-phone-name {
        font-size: clamp(1.5rem, 6vw, 2.2rem);

        font-weight: 500;

        letter-spacing: 0.04em;

        margin-bottom: 10px;
      }

      .mobile-phone-subtitle {
        font-size: clamp(0.95rem, 3.5vw, 1.15rem);

        letter-spacing: 0.08em;

        opacity: 0.7;

        margin-bottom: 38px;
      }

      .mobile-phone-message {
        max-width: 360px;

        font-size: clamp(0.9rem, 3.2vw, 1.05rem);

        line-height: 1.6;

        opacity: 0.65;
      }

      /* =========================================================
           INTRO
        ========================================================= */

      #intro {
        position: absolute;
        inset: 0;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;

        z-index: 1;
        background: #000000;
        cursor: pointer;

        transition:
          transform 0.8s cubic-bezier(0.77, 0, 0.175, 1),
          opacity 0.8s ease;

        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      /* =========================================================
   INTRO — ESTADO BASE
   ========================================================= */

      #intro:not(.vertical-current):not(.vertical-exit-up):not(
          .vertical-exit-down
        ):not(.vertical-enter-top):not(.vertical-enter-bottom) {
        opacity: 0;
        transform: translateY(100%);
        pointer-events: none;
      }

      #intro-content,
      #scroll-indicator {
        position: relative;
        z-index: 1;
      }

      /*
 * Una vez terminada la intro,
 * deja de interceptar mouse y scroll.
 *
 * Visualmente sigue estando ahí.
 */

      #intro-content {
        width: 100%;
        padding: 40px;
        box-sizing: border-box;

        display: flex;
        flex-direction: column;
        align-items: center;

        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);

        text-align: center;
      }

      #press-start {
        font-size: 0.75em;
        letter-spacing: 4px;
        opacity: 0.8;
        margin-bottom: 25px;
        animation: pressBlink 1.2s infinite;
      }

      @keyframes pressBlink {
        0%,
        50% {
          opacity: 0.8;
        }
        51%,
        100% {
          opacity: 0.2;
        }
      }

      /* =========================================================
   INTRO — ROLE
========================================================= */

      #typing-role {
        margin: 0;

        font-size: 1.2em;
        font-weight: 400;

        letter-spacing: 3px;
        text-transform: uppercase;
      }

      /* =========================================================
   INTRO — NAME
========================================================= */

      #typing-name {
        margin: 8px 0 0;

        font-size: 3em;
        font-weight: 500;

        letter-spacing: 1px;
      }

      /* =========================================================
   INTRO — SKILLS
========================================================= */

      #typing-subtitle {
        max-width: 800px;

        margin-top: 28px;
        padding: 0 20px;

        font-size: 1.15em;
        font-weight: 400;

        line-height: 1.5;
      }

      /* =========================================================
   INTRO — QUOTE
========================================================= */

      #typing-quote {
        max-width: 700px;

        margin-top: 28px;
        padding: 0 20px;

        font-size: 1.1em;
        font-weight: 400;

        font-style: italic;

        line-height: 1.5;
      }

      /* =========================================================
           AUDIO SETTINGS FOR USER CSS
        ========================================================= */

      #audio-control {
        position: fixed;
        top: 20px;
        right: 24px;

        display: flex;
        align-items: center;
        gap: 8px;

        z-index: 1000;
        touch-action: auto;
      }

      #audio-toggle {
        width: 35px;
        height: 35px;

        display: flex;
        align-items: center;
        justify-content: center;

        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 50%;

        background: transparent;
        color: #ffffff;

        font-family: inherit;
        font-size: 18px;
        line-height: 1;

        cursor: pointer;

        touch-action: auto;

        transform: translateX(-4px);

        transition:
          opacity 0.2s ease,
          border-color 0.2s ease;
      }

      #audio-toggle:hover {
        opacity: 0.65;
      }

      #audio-control,
      #language-control {
        display: none;
      }

      /* =========================================================
           CURSOR
        ========================================================= */

      .cursor {
        animation: blink 0.8s infinite;
      }

      @keyframes blink {
        0%,
        50% {
          opacity: 1;
        }

        51%,
        100% {
          opacity: 0;
        }
      }

      /* =========================================================
           SCROLL ARROW
        ========================================================= */

      #scroll-indicator {
        position: absolute;

        bottom: 50px;

        left: 50%;

        transform: translateX(-50%) translateY(20px);

        font-size: 32px;

        opacity: 0;

        pointer-events: none;

        transition:
          opacity 1s ease,
          transform 1s ease;
      }

      #scroll-indicator.visible {
        opacity: 0.7;

        transform: translateX(-50%) translateY(0);

        pointer-events: auto;

        animation: scrollBounce 1.8s infinite;
      }

      @keyframes scrollBounce {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }

        50% {
          transform: translateX(-50%) translateY(12px);
        }
      }

      /* =========================================================
           PORTFOLIO
        ========================================================= */

      #portfolio {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
      }

      /* =========================================================
           PAGE WRAPPER
        ========================================================= */

      .page-wrapper {
        width: 100%;
        height: 100%;
        margin: 0;
        position: relative;
      }

      /* =========================================================
           PROJECT SECTIONS
        ========================================================= */

      .portfolio-section {
        position: absolute;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        box-sizing: border-box;
        padding: clamp(25px, 5vh, 70px) clamp(20px, 2.5vw, 40px);

        opacity: 0;
        transform: translateY(100%);

        pointer-events: none;

        transition:
          transform 0.8s cubic-bezier(0.77, 0, 0.175, 1),
          opacity 0.8s ease;

        z-index: 1;
      }

      .portfolio-section > .project-container {
        position: relative;
        z-index: 1;
      }
      /* =========================================================
   PROJECT 3 — LAYOUT ESPECIAL
   ========================================================= */

      .project3-layout {
        display: flex;
        flex-direction: column;
      }

      /* =========================================================
   PROJECT 3 — LARGE CONTENT SLIDES
   ========================================================= */

      .project3-layout .project-gallery {
        flex: 1;

        min-height: 0;

        width: 100%;

        display: flex;

        flex-direction: column;

        justify-content: center;
      }

      .project3-layout .carousel-wrapper {
        flex: 1;

        min-height: 0;

        height: auto;

        display: flex;

        flex-direction: column;

        justify-content: center;

        --gallery-size: clamp(850px, 76vw, 1400px);
      }

      .project3-layout .carousel-stage {
        width: 100%;

        height: clamp(500px, 62vh, 720px);
      }

      .project3-layout .carousel-slide {
        width: clamp(850px, 76vw, 1400px);

        height: clamp(500px, 62vh, 720px);
      }

      /* =========================================================
   PROJECT 3 — COVERFLOW POSITION
   ========================================================= */

      .project3-layout .carousel-slide.previous {
        transform: translate(calc(-50% - 42vw), -50%) scale(0.55);

        opacity: 0.45;
      }

      .project3-layout .carousel-slide.next {
        transform: translate(calc(-50% + 42vw), -50%) scale(0.55);

        opacity: 0.45;
      }

      /* =========================================================
   PROJECT 3 — SLIDE CONTENT
   ========================================================= */

      .project3-layout .p3-slide-content {
        width: 100%;
        height: 100%;

        box-sizing: border-box;

        padding: 40px 80px;

        display: flex;
        flex-direction: column;
        justify-content: center;

        text-align: left;
      }

      .project3-layout .p3-slide-number {
        margin-bottom: 2px;

        font-size: 13px;
        letter-spacing: 4px;

        opacity: 0.55;
      }

      .project3-layout .p3-slide-content h3 {
        margin: 0 0 4px 0;

        font-size: clamp(30px, 2.4vw, 42px);
        line-height: 1.1;

        letter-spacing: 2px;
      }

      .project3-layout .p3-slide-content h4 {
        margin: 0 0 20px 0;

        font-size: clamp(14px, 1vw, 18px);
        line-height: 1.4;

        letter-spacing: 2px;

        opacity: 0.65;
      }

      /* =========================================================
   PROJECT 3 — MAIN PARAGRAPHS
   ========================================================= */

      .project3-layout .p3-slide-paragraph {
        width: 100%;
        max-width: 1300px;

        margin: 0 0 12px 0;

        font-size: clamp(14px, 1vw, 17px);
        line-height: 1.7;

        text-align: justify;
      }

      /* =========================================================
   PROJECT 3 — CORE FOCUS
   ========================================================= */

      .project3-layout .p3-core-focus {
        margin-top: 6px;

        width: 100%;
        max-width: 1300px;
      }

      .project3-layout .p3-core-focus h5 {
        margin: 0 0 8px 0;

        font-size: 12px;
        letter-spacing: 3px;

        opacity: 0.6;
      }

      .project3-layout .p3-focus-item {
        width: 100%;
        max-width: 1300px;

        margin-bottom: 9px;

        font-size: clamp(13px, 0.9vw, 16px);
        line-height: 1.6;

        overflow-wrap: break-word;
      }

      /* =========================================================
   PROJECT 3 — DOTS
========================================================= */

      .project3-layout .carousel-dots {
        flex-shrink: 0;

        margin-top: 14px;
        margin-bottom: 20px;
      }

      /* =========================================================
   VERTICAL CAROUSEL STATES
   ========================================================= */

      /* Elemento actualmente visible */
      .vertical-current {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
        z-index: 10;
      }

      /* Elemento que sale hacia arriba */
      .vertical-exit-up {
        opacity: 0;
        transform: translateY(-100%);
        pointer-events: none;
        z-index: 1;
      }

      /* Elemento que sale hacia abajo */
      .vertical-exit-down {
        opacity: 0;
        transform: translateY(100%);
        pointer-events: none;
        z-index: 1;
      }

      /* Elemento que entra desde arriba */
      .vertical-enter-top {
        opacity: 0;
        transform: translateY(-100%);
        pointer-events: none;
        z-index: 3;
      }

      /* Elemento que entra desde abajo */
      .vertical-enter-bottom {
        opacity: 0;
        transform: translateY(100%);
        pointer-events: none;
        z-index: 3;
      }

      /* Preparar una sección sin animarla */
      .vertical-no-transition {
        transition: none !important;
      }

      /* =========================================================
   SECTION BACKGROUNDS
   ========================================================= */

      .section-background {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }

      .section-background img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* =========================================================
   PROJECT CONTAINER
   ========================================================= */

      .project-container {
        width: min(94vw, 1550px);
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box;
        text-align: center;
        padding: clamp(20px, 4vh, 60px) 0;
      }

      /* =========================================================
   PROJECT HEADER
   ========================================================= */

      .project-header {
        width: min(94vw, 1550px);
        max-width: 100%;
        text-align: center;
      }

      /* =========================================================
   PROJECT TITLE
   ========================================================= */

      .project-title {
        margin: 0;
        padding: 0;
        font-size: clamp(1.7rem, max(2.2vw, 4.5vh), 2.8rem);
        font-weight: 500;
        letter-spacing: 0.5px;
        transform: translateY(-20px);
        width: min(90vw, 1500px);
        max-width: 1500px;
        margin-left: auto;
        margin-right: auto;
        text-align: center;
        white-space: normal;
        overflow-wrap: break-word;
      }

      /* =========================================================
   PROJECT SKILLS
   ========================================================= */

      .project-skills {
        width: 100%;

        display: flex;

        justify-content: center;

        align-items: center;

        flex-wrap: wrap;

        gap: 7px;

        margin: 4px 0 0;

        padding: 0;

        transform: translateY(-10px);
      }

      /* =========================================================
   INDIVIDUAL SKILL
   ========================================================= */

      .skill-tag {
        --skill-color: #888888;

        display: inline-flex;

        align-items: center;

        justify-content: center;

        padding: 5px 10px;

        border: 1px solid var(--skill-color);

        border-radius: 6px;

        background: color-mix(in srgb, var(--skill-color) 16%, transparent);

        color: #d8d8d8;

        font-size: clamp(0.75rem, max(0.85vw, 1.25vh), 0.95rem);

        line-height: 1;

        white-space: nowrap;

        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }

      /* =========================================================
   PROJECT INFO
   ========================================================= */

      .project-info {
        width: min(90vw, 1550px);

        margin: 0 auto;

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: clamp(25px, 2.5vw, 45px);

        align-items: start;

        text-align: left;

        position: relative;
        z-index: 1;
      }

      .project-info::before {
        content: "";

        position: absolute;

        top: -35px;
        bottom: -35px;
        left: -450px;
        right: -450px;

        background: radial-gradient(
          ellipse 75% 65% at center,
          rgba(0, 0, 0, 0.95) 50%,
          rgba(0, 0, 0, 0.7) 45%,
          rgba(0, 0, 0, 0) 90%
        );

        filter: blur(30px);

        z-index: 0;

        pointer-events: none;
      }

      /* =========================================================
   PROJECT DESCRIPTION
   ========================================================= */
      .project-description {
        margin: 0;
        padding: 0;
        width: 100%;
        font-size: clamp(1rem, 1.35rem + 0.5vh, 1.5rem);
        line-height: 1.65;
        color: #b0b0b0;
        text-align: center;
      }

      .desc-left,
      .desc-right {
        width: 100%;
        max-width: 680px;

        position: relative;
        z-index: 1;
      }

      .desc-quote {
        font-size: clamp(1.05rem, 1.15rem + 0.35vh, 1.3rem);
        font-style: italic;
        line-height: 1.55;
        margin-bottom: clamp(15px, 2vh, 25px);
        text-align: justify;
      }

      .desc-paragraph {
        font-size: clamp(0.95rem, 1rem + 0.3vh, 1.15rem);
        line-height: 1.55;
        text-align: justify;
      }

      .desc-title {
        font-size: clamp(1.1rem, 1.2rem + 0.3vh, 1.4rem);
        font-weight: 600;
        margin-bottom: clamp(10px, 1.5vh, 18px);
        text-align: left;
      }

      .desc-list {
        list-style: disc;
        padding-left: 20px;
      }

      .desc-list li {
        margin-bottom: clamp(8px, 1.2vh, 14px);
        font-size: clamp(0.95rem, 1rem + 0.25vh, 1.15rem);
        line-height: 1.5;
        text-align: justify;
      }

      /* =========================================================
   PROJECT GALLERY
========================================================= */

      .project-gallery {
        width: 100%;

        margin: 0;

        align-self: start;
      }

      /* =========================================================
           COVERFLOW CAROUSEL
        ========================================================= */

      .carousel-wrapper {
        --gallery-size: clamp(300px, min(43vw, 58vh), 580px);

        position: relative;
        width: 100%;
        height: calc(var(--gallery-size) * 0.56);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: visible;
        touch-action: none;
      }

      .carousel-stage {
        position: relative;
        width: 100%;
        height: calc(var(--gallery-size) * 0.56);
      }

      /* =========================================================
           SLIDES
        ========================================================= */

      .carousel-slide {
        position: absolute;

        top: 50%;
        left: 50%;

        width: var(--gallery-size);
        height: calc(var(--gallery-size) * 0.56);

        background: #111111;

        display: flex;

        justify-content: center;
        align-items: center;

        overflow: hidden;

        transform-origin: center center;

        cursor: pointer;

        transition:
          transform 0.55s cubic-bezier(0.77, 0, 0.175, 1),
          opacity 0.55s ease,
          filter 0.55s ease;
      }

      /* =========================================================
           CENTER SLIDE
        ========================================================= */

.carousel-slide.center {
    transform: translate(-50%, -50%) scale(1);

    opacity: 1;

    z-index: 5;

    filter: brightness(1);

    cursor: pointer;

    position: absolute;

    transition:
        transform 0.55s cubic-bezier(0.77, 0, 0.175, 1),
        opacity 0.55s ease,
        filter 0.25s ease;
}

/* =========================================================
   CENTER SLIDE — HOVER ANIMATION
   ONLY PROJECTS 1 AND 2
========================================================= */

.portfolio-section[data-project="0"] .carousel-slide.center:hover,
.portfolio-section[data-project="1"] .carousel-slide.center:hover {
    filter:
        brightness(1.2)
        drop-shadow(0 0 12px rgba(255, 215, 100, 0.65));

    animation: centerSlidePulse 1.6s ease-in-out infinite;
}


@keyframes centerSlidePulse {

    0%,
    100% {
        transform: translate(-50%, -50%) scale(1);
    }

    50% {
        transform: translate(-50%, -50%) scale(1.035);
    }

}

      /* =========================================================
           PREVIOUS SLIDE
        ========================================================= */

      .carousel-slide.previous {
        transform: translate(calc(-50% - 75%), -50%) scale(0.7);
        opacity: 0.45;
        z-index: 3;
        filter: brightness(0.6);
      }

      /* =========================================================
           NEXT SLIDE
        ========================================================= */

      .carousel-slide.next {
        transform: translate(calc(-50% + 75%), -50%) scale(0.7);
        opacity: 0.45;
        z-index: 3;
        filter: brightness(0.6);
      }

      /* =========================================================
           FAR SLIDES
        ========================================================= */

      .carousel-slide.hidden-left {
        transform: translate(calc(-50% - 45%), -50%) scale(0.5);

        opacity: 0;

        z-index: 1;
      }

      .carousel-slide.hidden-right {
        transform: translate(calc(-50% + 45%), -50%) scale(0.5);

        opacity: 0;

        z-index: 1;
      }

      /* =========================================================
           PLACEHOLDER CONTENT
        ========================================================= */

      .placeholder {
        width: 100%;
        height: 100%;

        display: flex;

        justify-content: center;
        align-items: center;

        background: linear-gradient(135deg, #111111, #222222);

        color: #777777;

        font-size: 28px;

        letter-spacing: 2px;
      }

      /* =========================================================
           REAL IMAGES
        ========================================================= */

      .carousel-slide img {
        width: 100%;
        height: 100%;

        object-fit: cover;

        display: block;
      }

      /* =========================================================
           VIDEOS
        ========================================================= */

      .carousel-slide video {
        width: 100%;
        height: 100%;

        object-fit: cover;

        display: block;
      }

      /* =========================================================
   CAROUSEL ARROWS
========================================================= */

      .carousel-button {
        position: absolute;

        top: 50%;

        z-index: 20;

        width: 130px;
        height: 120px;

        border: none;

        background: transparent;

        color: #ffffff;

        font-size: 38px;

        cursor: pointer;

        display: flex;

        justify-content: center;
        align-items: center;

        padding: 0;

        opacity: 0.72;

        transition:
          transform 0.25s ease,
          opacity 0.25s ease,
          filter 0.25s ease;
      }

      /* Las imágenes de las flechas-personaje */

      .carousel-button img {
        max-width: 100%;
        max-height: 100%;

        object-fit: contain;

        pointer-events: none;

        transition:
          transform 0.25s ease,
          filter 0.25s ease;
      }

      /* =========================================================
   POSITION
========================================================= */

      /* 
   En lugar de mandarlas a los extremos de toda la página,
   las colocamos a ambos lados de la imagen central.
*/

      .carousel-button.prev {
        left: calc(50% - (var(--gallery-size) / 2) - 150px);

        transform: translateY(-50%);

        animation: arrowHintLeft 2.2s ease-in-out infinite;
      }

      .carousel-button.next {
        right: calc(50% - (var(--gallery-size) / 2) - 150px);

        transform: translateY(-50%);

        animation: arrowHintRight 2.2s ease-in-out infinite;
      }

      /* =========================================================
   HOVER
========================================================= */

      .carousel-button:hover {
        opacity: 1;

        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.35));
      }

      /*
   IMPORTANTE:

   NO tocamos la animación del botón.

   Así, aunque el mouse entre y salga,
   las dos flechas siguen compartiendo
   exactamente el mismo ritmo.
*/

      .carousel-button.prev:hover img {
        transform: translateX(-8px) scale(1.12);
      }

      .carousel-button.next:hover img {
        transform: translateX(8px) scale(1.12);
      }

      .carousel-button:hover img {
        filter: brightness(1.2);
      }

      /* =========================================================
   CLICK
========================================================= */

      .carousel-button:active {
        opacity: 0.85;
      }

      .carousel-button.prev:active img {
        transform: translateX(-14px) scale(0.98);
      }

      .carousel-button.next:active img {
        transform: translateX(14px) scale(0.98);
      }

      /* =========================================================
   SUBTLE IDLE ANIMATION
========================================================= */

      @keyframes arrowHintLeft {
        0%,
        100% {
          transform: translateY(-50%) translateX(0);
        }

        50% {
          transform: translateY(-50%) translateX(-8px);
        }
      }

      @keyframes arrowHintRight {
        0%,
        100% {
          transform: translateY(-50%) translateX(0);
        }

        50% {
          transform: translateY(-50%) translateX(8px);
        }
      }

        align-items: center;

        gap: 10px;

        height: 8px;

        border-radius: 50%;

        background: #444444;

        cursor: pointer;

        transition:

          background 0.25s ease;

      .carousel-dot.active {
        background: #ffffff;

        transform: scale(1.35);

      El diseño normal se mantiene intacto.
      Solo empezamos a compactar cuando el viewport

   ========================================================= */

        right: 8%;

        bottom: 10%;

        right: 8%;
        bottom: 10%;

        font-size: clamp(1rem, 1.4vw, 1.3rem);

        letter-spacing: 0.05em;

        opacity: 0.7;

   ========================================================= */

        opacity: 0;
      }

        margin-top: 12px;

        opacity: 0.7;
      }

      /* =========================================================
   PORTFOLIO FADE TO BLACK
========================================================= */

      #portfolio-fade {
        position: fixed;

        inset: 0;

        background: #000000;

        opacity: 0;

        pointer-events: none;

        z-index: 999999;

        transition: opacity 1.2s ease;
      }

      /* =========================================================
   OUTRO CONTACT FORM
   ========================================================= */

      .outro-form {
        position: absolute;

        right: 8%;
        bottom: 10%;

        width: min(34vw, 480px);

        display: flex;
        flex-direction: column;

        gap: 22px;

        opacity: 0;
        transition: opacity 0.8s ease;

      .outro-form.visible {
        opacity: 1;
      }

      .outro-form-field {
        display: flex;
        flex-direction: column;

        gap: 7px;
      }

      .outro-form-field label {
        font-size: 0.7rem;

        letter-spacing: 0.15em;

        opacity: 0.5;
      }

      .outro-form-field input,
      .outro-form-field textarea {
        width: 100%;

        box-sizing: border-box;

        padding: 10px 0;

        border: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.35);

        background: transparent;

        color: #fff;

        font-family: inherit;

        font-size: 1rem;

        outline: none;

        resize: vertical;
      }

      .outro-form-field input:focus,
      .outro-form-field textarea:focus {
        border-bottom-color: #fff;
      }

      #contact-submit {
        align-self: flex-start;

        margin-top: 5px;

        padding: 9px 18px;

        border: 1px solid rgba(255, 255, 255, 0.5);

        background: transparent;

        color: #fff;

        font-family: inherit;

        font-size: 0.7rem;

        letter-spacing: 0.12em;

        cursor: pointer;

        transition:
          background 0.2s ease,
          color 0.2s ease;
      }

      #contact-submit:hover {
        background: #fff;

        color: #000;
      }

      /* =========================================================
   CAROUSEL LIGHTBOX
========================================================= */

      #carousel-lightbox {
        position: fixed;
        inset: 0;

        z-index: 50000;

        display: flex;
        align-items: center;
        justify-content: center;

        opacity: 0;
        pointer-events: none;

        transition: opacity 0.4s ease;
      }

      #carousel-lightbox.open {
        opacity: 1;
        pointer-events: auto;
      }

      #carousel-lightbox-backdrop {
        position: absolute;
        inset: 0;

        background: rgba(18, 18, 18, 0.88);
      }

      #carousel-lightbox-close {
        position: absolute;

        top: 24px;
        right: 24px;

        z-index: 2;

        width: 44px;
        height: 44px;

        display: flex;
        align-items: center;
        justify-content: center;

        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 50%;

        background: transparent;
        color: #ffffff;

        font-family: inherit;
        font-size: 18px;
        line-height: 1;

        cursor: pointer;

        transition:
          opacity 0.2s ease,
          border-color 0.2s ease,
          transform 0.2s ease;
      }

      #carousel-lightbox-close:hover {
        opacity: 0.7;
        transform: scale(1.08);
      }

      #carousel-lightbox-content {
        position: relative;
        z-index: 1;

        width: 100%;

        display: flex;
        justify-content: center;
      }

      /* =========================================================
   LIGHTBOX — ENLARGED CAROUSEL SIZE
========================================================= */

        width: auto;

        --gallery-size: clamp(700px, min(58vw, 70vh), 1300px);

        right: calc(50% - (var(--gallery-size) / 2) - 200px);
      }

      <script>
        /* =========================================================
 LANGUAGE SYSTEM
========================================================= */

        const languages = [
          {
            code: "en",
            name: "English",
          },

          {
            code: "es",
            name: "Español",
          },

          {
            code: "ja",
            name: "日本語",
          },
        ];

        /* =========================================================
   INITIAL LANGUAGE DETECTION
========================================================= */

        function detectInitialLanguage() {
          const browserLanguage = navigator.language.toLowerCase();

          if (browserLanguage.startsWith("es")) {
            return "es";
          }

          if (browserLanguage.startsWith("ja")) {
            return "ja";
          }

          return "en";
        }

        const initialLanguage = detectInitialLanguage();
        document.documentElement.lang = initialLanguage;

        let currentLanguageIndex = languages.findIndex(
          (language) => language.code === initialLanguage,
        );

        if (currentLanguageIndex === -1) {
          currentLanguageIndex = 0;
        }

        const languageUp = document.getElementById("language-up");

        const languageDown = document.getElementById("language-down");

        const currentLanguageElement =
          document.getElementById("current-language");

        /* =========================================================
   RENDER SKILLS
========================================================= */

        function renderSkills() {
          const languageCode = languages[currentLanguageIndex].code;

          document.querySelectorAll(".project-skills").forEach((container) => {
            const projectId = container.dataset.project;

            const projectSkillList = projectSkills[projectId];

            container.innerHTML = "";

            projectSkillList.forEach((skillId) => {
              const skill = skills[skillId];

              const tag = document.createElement("span");

              tag.classList.add("skill-tag");

              tag.textContent = skill.translations[languageCode];

              tag.style.setProperty("--skill-color", skill.color);

              container.appendChild(tag);
            });
          });
        }

        /* =========================================================
   MOBILE PHONE DETECTION
========================================================= */

        const isMobilePhone =
          /iPhone|iPod|Android.*Mobile|Windows Phone|BlackBerry|IEMobile/i.test(
            navigator.userAgent,
          );

        const mobilePhoneBlock = document.getElementById("mobile-phone-block");

        if (isMobilePhone && mobilePhoneBlock) {
          mobilePhoneBlock.style.display = "flex";

          document.documentElement.style.overflow = "hidden";

          document.body.style.overflow = "hidden";
        }

        /* =========================================================
   UPDATE LANGUAGE
========================================================= */
        function updateLanguage() {
          const language = languages[currentLanguageIndex];

          currentLanguageElement.textContent = language.name;

          document.documentElement.lang = language.code;

          const languageData = translations[language.code];

          /* =====================================================
       INTRO
    ===================================================== */

          role = languageData.role;

          introName = languageData.name;

          subtitle = languageData.subtitle;

          quote = languageData.quote;

          /* =====================================================
       PROJECT TEXTS
    ===================================================== */

          document.querySelectorAll("[data-translation]").forEach((element) => {
            const key = element.dataset.translation;

            if (languageData[key]) {
              element.textContent = languageData[key];
            }
          });

          /* =====================================================
       IF INTRO HAS NOT STARTED
    ===================================================== */

          if (!typingStarted) {
            titleElement.innerHTML = "";

            subtitleElement.innerHTML = "";

            quoteElement.innerHTML = "";
          }

          /* =====================================================
       IF INTRO HAS ALREADY FINISHED
    ===================================================== */

          if (typingFinished) {
            roleElement.textContent = role;

            titleElement.textContent = introName;

            subtitleElement.textContent = subtitle;

            quoteElement.textContent = quote;
          }

          setTimeout(() => {
            if (outroTypingFinished) {
              updateOutroTranslations();
            }
          }, 0);

          renderSkills();
        }

        languageUp.addEventListener("click", () => {
          currentLanguageIndex--;

          if (currentLanguageIndex < 0) {
            currentLanguageIndex = languages.length - 1;
          }

          updateLanguage();
        });

        languageDown.addEventListener("click", () => {
          currentLanguageIndex++;

          if (currentLanguageIndex >= languages.length) {
            currentLanguageIndex = 0;
          }

          updateLanguage();
        });

========================================================= */

   ========================================================= */

        function typeOutroText(element, text, speed = 45) {
          return new Promise((resolve) => {
            /*
             * CANCELACIÓN:
             *
             * Si el usuario salió de la OUTRO,
             * detenemos completamente la escritura.
             */
            if (outroTypingCancelled) {
              outroTypingResolve = null;

              resolve();

              return;
            }

            /*
             * Si se pidió SKIP,
             * escribimos directamente.
             */
            if (outroSkipRequested) {
              element.textContent = text;

              resolve();

              return;
            }

            outroTypingResolve = resolve;

            element.textContent = "";

            let index = 0;

            function typeCharacter() {
              /*
               * SKIP DURANTE LA ESCRITURA
               */
              if (outroSkipRequested) {
                element.textContent = text;

                outroTypingResolve = null;

                resolve();

                return;
              }

              if (index >= text.length) {
                outroTypingResolve = null;

                resolve();

                return;
              }

              element.textContent += text[index];

              /*
               * Sonido de máquina de escribir.
               */
              if (typeSound && text[index] !== " ") {
                if (audioEnabled && typeSound && text[index] !== " ") {
                  typeSound.currentTime = 0;

                  typeSound.play().catch(() => {});
                }
              }

              index++;

              const currentSpeed = outroMouseHeld ? fastSpeed : speed;

              outroTypingTimeout = setTimeout(typeCharacter, currentSpeed);
            }

            typeCharacter();
          });
        }

        let audioEnabled = true;

        let audioUnlocked = false;

        let audioTransitionId = 0;

        const audioFadeLevels = new WeakMap();
        const audioPositions = new WeakMap();

        function fadeAudio(
          audio,
          targetLevel,
          duration,
          pauseWhenFinished = false,
          transitionId = audioTransitionId,
        ) {
          if (!audio) return;

          const startLevel = audioFadeLevels.get(audio) ?? 1;

          const difference = targetLevel - startLevel;

          const startTime = performance.now();

          audioFadeLevels.set(audio, startLevel);

          function update() {
            /*
             * Si comenzó una nueva transición,
             * este fade ya no tiene autoridad.
             */
            if (transitionId !== audioTransitionId) {
              return;
            }

            const elapsed = performance.now() - startTime;

            const progress = Math.min(elapsed / duration, 1);

            const currentLevel = startLevel + difference * progress;

            audioFadeLevels.set(audio, currentLevel);

            /*
             * El volumen audible es:
             *
             * nivel del fade × volumen del usuario
             */
            audio.volume = audioEnabled ? currentLevel : 0;

            if (progress < 1) {
              requestAnimationFrame(update);
            } else {
              audioFadeLevels.set(audio, targetLevel);

              audio.volume = audioEnabled ? targetLevel : 0;

              if (targetLevel === 0 && pauseWhenFinished) {
                audioPositions.set(audio, audio.currentTime);

                audio.pause();
              }
            }
          }

          requestAnimationFrame(update);
        }

        function unlockAudio() {
          if (audioUnlocked) {
            return;
          }

          const introAudio = sectionAudios[0];

          if (!introAudio) {
            return;
          }

          introAudio.muted = true;

          introAudio
            .play()
            .then(() => {
              introAudio.pause();
              introAudio.currentTime = 0;
              introAudio.muted = false;

              audioUnlocked = true;
            })
            .catch(() => {
              // El navegador todavía no permitió reproducir audio.
            });
        }

        function changeSectionAudio(newIndex) {
          audioTransitionId++;

          const transitionId = audioTransitionId;

          /*
           * Apagamos todos los audios
           * que no pertenecen a la nueva sección.
           */
          sectionAudios.forEach((audio, index) => {
            if (!audio) return;

            if (index !== newIndex) {
              fadeAudio(audio, 0, AUDIO_FADE_TIME, true, transitionId);
            }
          });

          const newAudio = sectionAudios[newIndex];

          if (!newAudio) return;

          /*
           * Recuperamos la posición anterior.
           * Si es la primera vez que entramos,
           * comienza desde 0.
           */
          const savedTime = audioPositions.get(newAudio) ?? 0;

          newAudio.currentTime = savedTime;

          audioFadeLevels.set(newAudio, 0);

          newAudio.volume = 0;

          /*
           * El audio comienza aunque
           * el usuario esté muteado.
           */
          newAudio.play().catch(() => {});

          /*
           * Fade IN.
           */
          requestAnimationFrame(() => {
            if (transitionId !== audioTransitionId) {
              return;
            }

            fadeAudio(newAudio, 1, AUDIO_FADE_TIME, false, transitionId);

        /* =========================================================

   ========================================================= */

        function clearStates(element) {
          element.classList.remove(
            "vertical-current",
            "vertical-exit-up",
            "vertical-exit-down",
            "vertical-enter-top",
            "vertical-enter-bottom",
            "vertical-no-transition",

        function showVerticalSection(newIndex) {
          /*
           * =====================================================
           * VALIDACIONES
           * =====================================================
           */

          if (newIndex < 0 || newIndex >= verticalSections.length) {
            return;
          }

          if (newIndex === currentSection) {
            return;
          }

          if (verticalLocked) {
            return;
          }

          /*
           * =====================================================
           * BLOQUEAMOS LA TRANSICIÓN
           * =====================================================
           */

          verticalLocked = true;

          /*
           * =====================================================
           * IDENTIFICAMOS CURRENT Y TARGET
           * =====================================================
           */

          const current = verticalSections[currentSection];

          const target = verticalSections[newIndex];

          /*
           * Si estamos saliendo de la OUTRO
           * mientras todavía se está escribiendo,
           * cancelamos completamente el proceso.
           */
          if (current.id === "outro" && !outroTypingFinished) {
            cancelOutroTyping();
          }

          /*
           * =====================================================
           * DETERMINAMOS DIRECCIÓN
           * =====================================================
           *
           * newIndex > currentSection
           * → estamos bajando
           *
           * newIndex < currentSection
           * → estamos subiendo
           */

          const movingDown = newIndex > currentSection;

          /*
           * =====================================================
           * LIMPIAMOS ESTADOS ANTERIORES
           * =====================================================
           */

          clearStates(current);
          clearStates(target);

          /*
           * =====================================================
           * PREPARAMOS EL TARGET
           *
           * IMPORTANTE:
           *
           * Lo hacemos SIN transición.
           *
           * Así evitamos que el target pase
           * visualmente de +100% a -100%.
           * =====================================================
           */

          target.classList.add("vertical-no-transition");

          if (movingDown) {
            /*
             * BAJAMOS:
             *
             * P1 → P2
             *
             * P2 tiene que empezar ABAJO.
             */

            target.classList.add("vertical-enter-bottom");
          } else {
            /*
             * SUBIMOS:
             *
             * P2 → P1
             *
             * P1 tiene que empezar ARRIBA.
             */

            target.classList.add("vertical-enter-top");
          }

          /*
           * =====================================================
           * FORZAMOS AL NAVEGADOR A APLICAR
           * ESA POSICIÓN INICIAL.
           * =====================================================
           */

          target.offsetHeight;

          /*
           * =====================================================
           * AHORA PREPARAMOS LA SALIDA
           * DEL ELEMENTO ACTUAL.
           * =====================================================
           */

          if (movingDown) {
            current.classList.add("vertical-exit-up");
          } else {
            current.classList.add("vertical-exit-down");
          }

          /*
           * =====================================================
           * ACTUALIZAMOS EL ÍNDICE
           * =====================================================

          currentSection = newIndex;

           * Quitamos "no-transition".

           * Ahora sí empieza la animación.
           * =====================================================

              "vertical-enter-bottom",
            );

            target.classList.add("vertical-current");

           * FINAL DE LA ANIMACIÓN

            verticalLocked = false;

            return;
          }

          unlockAudio();

          if (typingFinished) {
            return;
          }

          const now = Date.now();

          if (now - lastTapTime < DOUBLE_TAP_DELAY) {
            finishTypingImmediately();
            lastTapTime = 0;
            return;
          }

          lastTapTime = now;

          mouseHeld = true;

          if (!typingStarted) {
            startTyping();
          }
        });

        intro.addEventListener("touchend", () => {
          if (isMobilePhone) {
            return;
          }

          if (typingFinished) {
            return;
          }

          mouseHeld = false;
        });

        window.addEventListener("touchstart", (event) => {
          unlockAudio();

          if (!typingFinished) {
            return;
          }

          if (event.target.closest("#audio-control")) {
            return;
          }

          const touch = event.touches[0];

          touchStartX = touch.clientX;
          touchStartY = touch.clientY;

          touchTarget = event.target;
        });

        window.addEventListener("touchend", (event) => {

          if (lightboxOpen) {
            return;
          }
          if (!typingFinished) {
            return;
          }

          if (event.target.closest("#audio-control")) {
            return;
          }

          const touch = event.changedTouches[0];

          const deltaX = touch.clientX - touchStartX;
          const deltaY = touch.clientY - touchStartY;

          const absX = Math.abs(deltaX);
          const absY = Math.abs(deltaY);

          if (Math.max(absX, absY) < SWIPE_THRESHOLD) {
            return;
          }

          /*
           * SWIPE HORIZONTAL
           */
          if (absX > absY) {
            const carousel = touchTarget.closest(".carousel-wrapper");

            if (!carousel) {
              return;
            }

            const section = carousel.closest(".portfolio-section");

            if (!section) {
              return;
            }

            const carouselIndex = Array.from(projects).indexOf(section);

            if (carouselIndex === -1) {
              return;
            }

            if (deltaX < 0) {
              // Swipe hacia la izquierda → siguiente imagen
              moveCarousel(carouselIndex, 1);
            } else {
              // Swipe hacia la derecha → imagen anterior
              moveCarousel(carouselIndex, -1);
            }

            return;
          }

          /*
           * SWIPE VERTICAL
           */
          if (deltaY < 0) {
            // Swipe hacia arriba → siguiente sección
            showVerticalSection(currentSection + 1);
          } else {
            // Swipe hacia abajo → sección anterior
            showVerticalSection(currentSection - 1);
          }
        });

    window.addEventListener(
      "wheel",
      (event) => {

        if (lightboxOpen) {
          event.preventDefault();
          return;
        }

        if (!typingFinished) {
          return;
        }

        const currentElement = verticalSections[currentSection];

        /*
        * =====================================================
        * SCROLL INTERNO DE LA SECCIÓN ACTUAL
        * =====================================================
        */

        if (currentElement.classList.contains("portfolio-section")) {

          const canScroll =
            currentElement.scrollHeight > currentElement.clientHeight;

          if (canScroll) {

            const isScrollingDown = event.deltaY > 0;
            const isScrollingUp = event.deltaY < 0;

            const isAtTop =
              currentElement.scrollTop <= 0;

            const isAtBottom =
              currentElement.scrollTop +
              currentElement.clientHeight >=
              currentElement.scrollHeight - 1;


            /*
            * Si todavía hay contenido para recorrer,
            * dejamos que el navegador haga el scroll normal.
            */

            if (
              (isScrollingDown && !isAtBottom) ||
              (isScrollingUp && !isAtTop)
            ) {
              return;
            }
          }
        }


        /*
        * =====================================================
        * TRANSICIÓN ENTRE PROYECTOS
        * =====================================================
        */

        event.preventDefault();

        if (verticalLocked) {
          return;
        }

        if (Math.abs(event.deltaY) < 10) {
          return;
        }

        if (event.deltaY > 0) {

          showVerticalSection(currentSection + 1);

        } else {

          showVerticalSection(currentSection - 1);

        }

      },
      {
        passive: false,
      },
    );

        /* =========================================================
   KEYBOARD
   ========================================================= */
window.addEventListener("keydown", (event) => {

  if (lightboxOpen) {

    if (event.key === "Escape") {
      event.preventDefault();
      closeCarouselLightbox();
    } else if (event.key === "ArrowLeft" && lightboxPrevButton) {
      event.preventDefault();
      lightboxPrevButton.click();
    } else if (event.key === "ArrowRight" && lightboxNextButton) {
      event.preventDefault();
      lightboxNextButton.click();
    }

    return;
  }

  if (!typingFinished) {
    return;
  }


  /* =====================================================
     VERTICAL
  ===================================================== */

  if (event.key === "ArrowDown" || event.key === "PageDown") {

    event.preventDefault();

    showVerticalSection(currentSection + 1);

    return;
  }


  if (event.key === "ArrowUp" || event.key === "PageUp") {

    event.preventDefault();

    showVerticalSection(currentSection - 1);

    return;
  }


/* =====================================================
   HORIZONTAL CAROUSEL
===================================================== */

if (
  event.key !== "ArrowLeft" &&
  event.key !== "ArrowRight"
) {
  return;
}


/*
   La intro es índice 0.
*/

if (currentSection === 0) {
  return;
}


const currentProject =
  verticalSections[currentSection];


/*
   Buscamos los botones del carrusel
   dentro del proyecto actual.
*/

const previousButton =
  currentProject.querySelector(".carousel-button.prev");

const nextButton =
  currentProject.querySelector(".carousel-button.next");

if (event.key === "ArrowLeft") {

  event.preventDefault();

if (event.key === "ArrowRight") {

}

});

        /* =========================================================
   INITIAL STATE
   ========================================================= */

        setInitialVerticalState();

        /* =========================================================
           HORIZONTAL CAROUSELS
        ========================================================= */

        const carouselIndexes = [0, 0, 0];

        /* =========================================================
           CAROUSEL LIGHTBOX STATE
        ========================================================= */

        const carouselLightbox = document.getElementById("carousel-lightbox");
        const carouselLightboxBackdrop = document.getElementById(
          "carousel-lightbox-backdrop",
        );
        const carouselLightboxClose = document.getElementById(
          "carousel-lightbox-close",
        );
        const carouselLightboxContent = document.getElementById(
          "carousel-lightbox-content",
        );

        let lightboxOpen = false;
        let lightboxFromRect = null;
        let activeLightboxCarouselIndex = null;
        let lightboxPrevButton = null;
        let lightboxNextButton = null;

        const arrowAssetsByCarousel = {
          0: {
            normalPrev: "images/ui/arrowP1-prev.webp",
            pressedPrev: "images/ui/arrowP1-prev-pressed.webp",
            normalNext: "images/ui/arrowP1-next.webp",
            pressedNext: "images/ui/arrowP1-next-pressed.webp",
          },
          1: {
            normalPrev: "images/ui/arrowP2-prev.webp",
            pressedPrev: "images/ui/arrowP2-prev-pressed.webp",
            normalNext: "images/ui/arrowP2-next.webp",
            pressedNext: "images/ui/arrowP2-next-pressed.webp",
          },
        };

        /* =========================================================
           UPDATE COVERFLOW
        ========================================================= */

        function updateCarousel(carouselIndex, container = projects[carouselIndex]) {
          const section = container;

          const slides = section.querySelectorAll(".carousel-slide");

          const total = slides.length;

          const currentIndex = carouselIndexes[carouselIndex];

          slides.forEach((slide, index) => {
            slide.classList.remove(
              "center",
              "previous",
              "next",
              "hidden-left",
              "hidden-right",
            );

            if (index === currentIndex) {
              slide.classList.add("center");
            } else if (index === getWrappedIndex(currentIndex - 1, total)) {
              slide.classList.add("previous");
            } else if (index === getWrappedIndex(currentIndex + 1, total)) {
              slide.classList.add("next");
            } else if (isBefore(index, currentIndex, total)) {
              slide.classList.add("hidden-left");
            } else {
              slide.classList.add("hidden-right");
            }
          });

          /* Update dots */

          const dots = section.querySelectorAll(".carousel-dot");

          dots.forEach((dot, index) => {
            dot.classList.toggle("active", index === currentIndex);
          });
        }

        /* =========================================================
           WRAPPED INDEX
        ========================================================= */

        function getWrappedIndex(index, total) {
          return ((index % total) + total) % total;
        }

        /* =========================================================
           DETERMINE SIDE
        ========================================================= */

        function isBefore(index, current, total) {
          const difference = (index - current + total) % total;

          return difference > total / 2;
        }

        /* =========================================================
           MOVE CAROUSEL
        ========================================================= */

function moveCarousel(carouselIndex, direction, container) {
  const section = container || projects[carouselIndex];

  const slides = section.querySelectorAll(".carousel-slide");

  const total = slides.length;

  carouselIndexes[carouselIndex] = getWrappedIndex(
    carouselIndexes[carouselIndex] + direction,
    total,
  );

  updateCarousel(carouselIndex, section);
}

/* =========================================================
   SELECT SLIDE
========================================================= */

function selectSlide(carouselIndex, slideIndex, container) {
  carouselIndexes[carouselIndex] = slideIndex;

  updateCarousel(carouselIndex, container || projects[carouselIndex]);
}

        /* =========================================================
           INITIALIZE CAROUSELS
        ========================================================= */

        updateCarousel(0);

        updateCarousel(1);

        updateCarousel(2);

        /* =========================================================
          SONIDO CLICKS
        ========================================================= */

        const arrowSound = document.getElementById("arrow-sound");
        const arrowSoundP2 = document.getElementById("arrow-sound-p2");
        const arrowSoundP3 = document.getElementById("arrow-sound-p3");

        function pressArrow(imgElement, normalSrc, pressedSrc) {
          imgElement.src = pressedSrc;

          let soundToPlay = arrowSound;

          // Si la flecha pertenece al Proyecto 2
          if (
            imgElement.id === "arrowP2-prev-img" ||
            imgElement.id === "arrowP2-next-img"
          ) {
            soundToPlay = arrowSoundP2;
          }

          // Si la flecha pertenece al Proyecto 3
          if (
            imgElement.id === "arrowP3-prev-img" ||
            imgElement.id === "arrowP3-next-img"
          ) {
            soundToPlay = arrowSoundP3;
          }

          if (audioEnabled && soundToPlay) {
            soundToPlay.currentTime = 0;

            soundToPlay.play().catch(() => {});
          }

          setTimeout(() => {
            imgElement.src = normalSrc;
          }, 150);
        }

        /* =========================================================
   CAROUSEL LIGHTBOX
========================================================= */

        /*
         * Igual que pressArrow, pero elige el sonido
         * según el índice de carrusel en lugar del id
         * del <img> (el clon del lightbox no tiene ids,
         * para no duplicarlos con el carrusel original).
         */

        function pressArrowForCarousel(
          carouselIndex,
          imgElement,
          normalSrc,
          pressedSrc,
        ) {
          imgElement.src = pressedSrc;

          const soundByCarousel = {
            0: arrowSound,
            1: arrowSoundP2,
            2: arrowSoundP3,
          };

          const soundToPlay = soundByCarousel[carouselIndex];

          if (audioEnabled && soundToPlay) {
            soundToPlay.currentTime = 0;

            soundToPlay.play().catch(() => {});
          }

          setTimeout(() => {
            imgElement.src = normalSrc;
          }, 150);
        }

        /*
         * =====================================================
         * CONECTAMOS LOS BOTONES Y DOTS DEL CLON
         * =====================================================
         *
         * El clon no trae los onclick originales
         * (los sacamos al clonar), así que acá le
         * enchufamos listeners propios.
         */

        function wireLightboxCarousel(clone, carouselIndex) {
          const assets = arrowAssetsByCarousel[carouselIndex];

          const prevButton = clone.querySelector(".carousel-button.prev");
          const nextButton = clone.querySelector(".carousel-button.next");

          const prevImg = prevButton.querySelector("img");
          const nextImg = nextButton.querySelector("img");

prevButton.addEventListener("click", () => {
  pressArrowForCarousel(
    carouselIndex,
    prevImg,
    assets.normalPrev,
    assets.pressedPrev,
  );

  moveCarousel(carouselIndex, -1, clone);
});

nextButton.addEventListener("click", () => {
  pressArrowForCarousel(
    carouselIndex,
    nextImg,
    assets.normalNext,
    assets.pressedNext,
  );

  moveCarousel(carouselIndex, 1, clone);
});

clone.querySelectorAll(".carousel-dot").forEach((dot, index) => {
  dot.addEventListener("click", () => {
    selectSlide(carouselIndex, index, clone);
  });
});

          lightboxPrevButton = prevButton;
          lightboxNextButton = nextButton;
        }

        /*
         * =====================================================
         * ABRIR EL LIGHTBOX
         * =====================================================
         *
         * Técnica FLIP:
         * 1. Medimos dónde está el carrusel original (fromRect).
         * 2. Insertamos el clon ya en su tamaño/posición FINAL.
         * 3. Le aplicamos un transform que lo hace VERSE como
         *    si todavía estuviera en fromRect.
         * 4. En el frame siguiente, sacamos ese transform con
         *    una transición: el navegador anima solo.
         */

        function openCarouselLightbox(carouselIndex) {
          if (carouselIndex !== 0 && carouselIndex !== 1) {
            return;
          }

          const section = projects[carouselIndex];

          const gallery = section.querySelector(".project-gallery");

const sourceSlide = gallery.querySelector(".carousel-slide.center");

lightboxFromRect = sourceSlide.getBoundingClientRect();

          /*
           * Clonamos TODO el project-gallery
           * (carrusel + botones + dots).
           */

          const clone = gallery.cloneNode(true);

          clone.classList.add("lightbox-gallery");

          /*
           * Sacamos ids y onclicks originales
           * para evitar duplicados y conflictos.
           */

          clone.querySelectorAll("[id]").forEach((element) => {
            element.removeAttribute("id");
          });

          clone.querySelectorAll("[onclick]").forEach((element) => {
            element.removeAttribute("onclick");
          });

          carouselLightboxContent.innerHTML = "";

          carouselLightboxContent.appendChild(clone);

          wireLightboxCarousel(clone, carouselIndex);

          activeLightboxCarouselIndex = carouselIndex;

          lightboxOpen = true;

          carouselLightbox.classList.add("open");

          /*
           * Medimos la posición FINAL
           * (ya con el tamaño grande aplicado por CSS)
           * y calculamos el transform inicial
           * para que arranque pareciendo
           * el carrusel chico de origen.
           */

const cloneSlide = clone.querySelector(".carousel-slide.center");

const toRect = cloneSlide.getBoundingClientRect();

const fromCenterX =
  lightboxFromRect.left + lightboxFromRect.width / 2;

const fromCenterY =
  lightboxFromRect.top + lightboxFromRect.height / 2;

const toCenterX =
  toRect.left + toRect.width / 2;

const toCenterY =
  toRect.top + toRect.height / 2;

const deltaX = fromCenterX - toCenterX;
const deltaY = fromCenterY - toCenterY;

const scaleX = lightboxFromRect.width / toRect.width;
const scaleY = lightboxFromRect.height / toRect.height;

cloneSlide.style.transition = "none";

cloneSlide.style.transform =
  `translate(-50%, -50%) ` +
  `translate(${deltaX}px, ${deltaY}px) ` +
  `scale(${scaleX}, ${scaleY})`;

cloneSlide.offsetWidth;

requestAnimationFrame(() => {
  cloneSlide.style.transition =
    "transform 0.7s cubic-bezier(0.77, 0, 0.175, 1)";

  cloneSlide.style.transform =
    "translate(-50%, -50%) scale(1, 1)";
});
        }

        /*
         * =====================================================
         * CERRAR EL LIGHTBOX
         * =====================================================
         *
         * Mismo truco FLIP, pero al revés:
         * animamos desde el tamaño grande actual
         * de vuelta hacia fromRect.
         */

        function closeCarouselLightbox() {
          if (!lightboxOpen) {
            return;
          }

const cloneSlide = carouselLightboxContent.querySelector(
  ".carousel-slide.center",
);

lightboxOpen = false;

carouselLightbox.classList.remove("open");

/*
 * Recién ahora pintamos el carrusel chico original
 * con el índice final que quedó en el clon.
 * Queda tapado por el clon mientras se achica,
 * así que el cambio no se ve saltar.
 */

if (activeLightboxCarouselIndex !== null) {
  updateCarousel(activeLightboxCarouselIndex);
}

if (cloneSlide && lightboxFromRect) {
  const currentRect = cloneSlide.getBoundingClientRect();

  const fromCenterX =
    lightboxFromRect.left + lightboxFromRect.width / 2;

  const fromCenterY =
    lightboxFromRect.top + lightboxFromRect.height / 2;

  const currentCenterX =
    currentRect.left + currentRect.width / 2;

  const currentCenterY =
    currentRect.top + currentRect.height / 2;

  const deltaX = fromCenterX - currentCenterX;
  const deltaY = fromCenterY - currentCenterY;

  const scaleX = lightboxFromRect.width / currentRect.width;
  const scaleY = lightboxFromRect.height / currentRect.height;

  cloneSlide.style.transition =
    "transform 0.6s cubic-bezier(0.77, 0, 0.175, 1)";

  cloneSlide.style.transform =
    `translate(-50%, -50%) ` +
    `translate(${deltaX}px, ${deltaY}px) ` +
    `scale(${scaleX}, ${scaleY})`;
}

          /*
           * Esperamos a que termine la animación
           * antes de vaciar el contenido.
           */

            setTimeout(() => {
            carouselLightboxContent.innerHTML = "";

            lightboxFromRect = null;
            activeLightboxCarouselIndex = null;
            lightboxPrevButton = null;
            lightboxNextButton = null;
          }, 650);
        }

        /*
         * =====================================================
         * DETECTAR CLICK EN LA IMAGEN CENTRAL
         * =====================================================
         *
         * Usamos "capture: true" para que esto se ejecute
         * ANTES que el onclick original de la slide
         * (que solo mueve el carrusel). Así podemos chequear
         * si la slide YA estaba centrada antes de que
         * selectSlide la centre de nuevo.
         */

        document.addEventListener(
          "click",
          (event) => {
            const slide = event.target.closest(".carousel-slide");

            if (!slide) {
              return;
            }

            /*
             * Ignoramos clicks dentro del propio lightbox
             * (si no, se podría re-abrir en loop).
             */

            if (slide.closest("#carousel-lightbox-content")) {
              return;
            }

            if (!slide.classList.contains("center")) {
              return;
            }

            const section = slide.closest(".portfolio-section");

            if (!section) {
              return;
            }

            const carouselIndex = Number(section.dataset.project);

            if (carouselIndex !== 0 && carouselIndex !== 1) {
              return;
            }

            openCarouselLightbox(carouselIndex);
          },
          true,
        );

        /*
         * =====================================================
         * CERRAR: cruz y click fuera de la imagen
         * =====================================================
         */

        carouselLightboxClose.addEventListener("click", () => {
          closeCarouselLightbox();
        });

        carouselLightboxBackdrop.addEventListener("click", () => {
          closeCarouselLightbox();
        });
      </script>
    </div>
