<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Agustín Andrés Ibarra — Videogame Narrative Designer
    </title>


    <style>


        /* =========================================================
           GENERAL
        ========================================================= */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000000;
            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
        }


        body {

            cursor: default;

        }

/* =========================================================
 LANGUAGE SELECTOR
========================================================= */

#language-control {

    position: fixed;

    top: 20px;
    left: 24px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 4px;

    z-index: 1000;

    touch-action: auto;

}


#language-control button {

    border: none;

    background: transparent;

    color: #ffffff;

    font-size: 12px;

    cursor: pointer;

    padding: 2px 0;

    opacity: 0.6;

    transition:
        opacity 0.2s ease,
        transform 0.2s ease;

         width: 100%;
    text-align: center;

}


#language-control button:hover {

    opacity: 1;

    transform: scale(1.15);

}


#current-language {

    min-width: 90px;

    text-align: center;

    font-size: 13px;

    letter-spacing: 1px;

    color: #ffffff;

    user-select: none;

}
        /* =========================================================
           INTRO
        ========================================================= */

#intro {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;

    z-index: 1;
    background: #000000;
    cursor: pointer;

    transition:
        transform 0.8s cubic-bezier(
            0.77,
            0,
            0.175,
            1
        ),
        opacity 0.8s ease;
}

/* =========================================================
   INTRO — ESTADO BASE
   ========================================================= */

#intro:not(.vertical-current):not(.vertical-exit-up):not(.vertical-exit-down):not(.vertical-enter-top):not(.vertical-enter-bottom) {
    opacity: 0;
    transform: translateY(100%);
    pointer-events: none;
}

        #intro-content,
#scroll-indicator {
    position: relative;
    z-index: 1;
}

        /*
 * Una vez terminada la intro,
 * deja de interceptar mouse y scroll.
 *
 * Visualmente sigue estando ahí.
 */

#intro-content {
    width: 100%;
    padding: 40px;
    box-sizing: border-box;

    display: flex;
    flex-direction: column;
    align-items: center;

    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);

    text-align: center;
}

#press-start {
    font-size: 0.75em;
    letter-spacing: 4px;
    opacity: 0.8;
    margin-bottom: 25px;
    animation: pressBlink 1.2s infinite;
}

@keyframes pressBlink {
    0%, 50% { opacity: 0.8; }
    51%, 100% { opacity: 0.2; }
}


/* =========================================================
   INTRO — ROLE
========================================================= */

#typing-role {

    margin: 0;

    font-size: 1.2em;
    font-weight: 400;

    letter-spacing: 3px;
    text-transform: uppercase;

}


/* =========================================================
   INTRO — NAME
========================================================= */

#typing-name {

    margin: 8px 0 0;

    font-size: 3em;
    font-weight: 500;

    letter-spacing: 1px;

}


/* =========================================================
   INTRO — SKILLS
========================================================= */

#typing-subtitle {

    max-width: 800px;

    margin-top: 28px;
    padding: 0 20px;

    font-size: 1.15em;
    font-weight: 400;

    line-height: 1.5;

}


/* =========================================================
   INTRO — QUOTE
========================================================= */

#typing-quote {

    max-width: 700px;

    margin-top: 28px;
    padding: 0 20px;

    font-size: 1.1em;
    font-weight: 400;

    font-style: italic;

    line-height: 1.5;

}

    /* =========================================================
           AUDIO SETTINGS FOR USER CSS
        ========================================================= */

    #audio-control {
    position: fixed;
    top: 20px;
    right: 24px;

    display: flex;
    align-items: center;
    gap: 8px;

    z-index: 1000;
    touch-action: auto;
}

#audio-toggle {
    width: 36px;
    height: 36px;

    border: none;
    background: transparent;

    color: #ffffff;

    font-size: 20px;

    cursor: pointer;
}

#audio-volume {
    width: 90px;
    cursor: pointer;
}

#audio-toggle,
#audio-volume {
    touch-action: auto;
}

#audio-control,
#language-control {
    display: none;
}

        /* =========================================================
           CURSOR
        ========================================================= */

        .cursor {

            animation:
                blink 0.8s infinite;

        }


        @keyframes blink {

            0%,
            50% {

                opacity: 1;

            }

            51%,
            100% {

                opacity: 0;

            }

        }


        /* =========================================================
           SCROLL ARROW
        ========================================================= */

        #scroll-indicator {

            position: absolute;

            bottom: 50px;

            left: 50%;

            transform:
                translateX(-50%)
                translateY(20px);

            font-size: 32px;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 1s ease,
                transform 1s ease;

        }


        #scroll-indicator.visible {

            opacity: 0.7;

            transform:
                translateX(-50%)
                translateY(0);

            pointer-events: auto;

            animation:
                scrollBounce 1.8s infinite;

        }


        @keyframes scrollBounce {

            0%,
            100% {

                transform:
                    translateX(-50%)
                    translateY(0);

            }

            50% {

                transform:
                    translateX(-50%)
                    translateY(12px);

            }

        }


        /* =========================================================
           PORTFOLIO
        ========================================================= */

#portfolio {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000000;
}

        /* =========================================================
           PAGE WRAPPER
        ========================================================= */

.page-wrapper {
    width: 100%;
    height: 100%;
    margin: 0;
    position: relative;
}



        /* =========================================================
           PROJECT SECTIONS
        ========================================================= */

.portfolio-section {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    box-sizing: border-box;
    padding: clamp(25px, 5vh, 70px) clamp(20px, 2.5vw, 40px);

    opacity: 0;
    transform: translateY(100%);

    pointer-events: none;

    transition:
        transform 0.8s cubic-bezier(
            0.77,
            0,
            0.175,
            1
        ),
        opacity 0.8s ease;

    z-index: 1;
}

.portfolio-section > .project-container {
    position: relative;
    z-index: 1;
}
/* =========================================================
   PROJECT 3 — LAYOUT ESPECIAL
   ========================================================= */

.project3-layout {
    display: flex;
    flex-direction: column;
}


/* =========================================================
   PROJECT 3 — LARGE CONTENT SLIDES
   ========================================================= */

.project3-layout .project-gallery {
    flex: 1;
    min-height: 0;
    width: 100%;

    display: flex;
    flex-direction: column;
}


.project3-layout .carousel-wrapper {
    flex: 1;
    min-height: 0;

    height: auto;

    --gallery-size: clamp(
        850px,
        76vw,
        1400px
    );
}


.project3-layout .carousel-stage {
    width: 100%;

    height: clamp(
        500px,
        62vh,
        720px
    );
}


.project3-layout .carousel-slide {
    width: clamp(
        850px,
        76vw,
        1400px
    );

    height: clamp(
        500px,
        62vh,
        720px
    );
}


/* =========================================================
   PROJECT 3 — COVERFLOW POSITION
   ========================================================= */

.project3-layout .carousel-slide.previous {
    transform:
        translate(
            calc(-50% - 42vw),
            -50%
        )
        scale(0.55);

    opacity: 0.45;
}


.project3-layout .carousel-slide.next {
    transform:
        translate(
            calc(-50% + 42vw),
            -50%
        )
        scale(0.55);

    opacity: 0.45;
}


/* =========================================================
   PROJECT 3 — SLIDE CONTENT
   ========================================================= */

.project3-layout .p3-slide-content {
    width: 100%;
    height: 100%;

    box-sizing: border-box;

    padding: 40px 80px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    text-align: left;
}


.project3-layout .p3-slide-number {
    margin-bottom: 2px;

    font-size: 13px;
    letter-spacing: 4px;

    opacity: 0.55;
}


.project3-layout .p3-slide-content h3 {
    margin: 0 0 4px 0;

    font-size: clamp(30px, 2.4vw, 42px);
    line-height: 1.1;

    letter-spacing: 2px;
}


.project3-layout .p3-slide-content h4 {
    margin: 0 0 20px 0;

    font-size: clamp(14px, 1vw, 18px);
    line-height: 1.4;

    letter-spacing: 2px;

    opacity: 0.65;
}


/* =========================================================
   PROJECT 3 — MAIN PARAGRAPHS
   ========================================================= */

.project3-layout .p3-slide-paragraph {
    width: 100%;
    max-width: 1300px;

    margin: 0 0 12px 0;

    font-size: clamp(14px, 1vw, 17px);
    line-height: 1.7;

    text-align: justify;
}


/* =========================================================
   PROJECT 3 — CORE FOCUS
   ========================================================= */

.project3-layout .p3-core-focus {
    margin-top: 6px;

    width: 100%;
    max-width: 1300px;
}


.project3-layout .p3-core-focus h5 {
    margin: 0 0 8px 0;

    font-size: 12px;
    letter-spacing: 3px;

    opacity: 0.6;
}


.project3-layout .p3-focus-item {
    width: 100%;
    max-width: 1300px;

    margin-bottom: 9px;

    font-size: clamp(13px, 0.9vw, 16px);
    line-height: 1.6;

    overflow-wrap: break-word;
}


/* =========================================================
   VERTICAL CAROUSEL STATES
   ========================================================= */

/* Elemento actualmente visible */
.vertical-current {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    z-index: 10;
}


/* Elemento que sale hacia arriba */
.vertical-exit-up {
    opacity: 0;
    transform: translateY(-100%);
    pointer-events: none;
    z-index: 1;
}


/* Elemento que sale hacia abajo */
.vertical-exit-down {
    opacity: 0;
    transform: translateY(100%);
    pointer-events: none;
    z-index: 1;
}


/* Elemento que entra desde arriba */
.vertical-enter-top {
    opacity: 0;
    transform: translateY(-100%);
    pointer-events: none;
    z-index: 3;
}


/* Elemento que entra desde abajo */
.vertical-enter-bottom {
    opacity: 0;
    transform: translateY(100%);
    pointer-events: none;
    z-index: 3;
}

/* Preparar una sección sin animarla */
.vertical-no-transition {
    transition: none !important;
}

/* =========================================================
   SECTION BACKGROUNDS
   ========================================================= */

.section-background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
}

.section-background img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}


/* =========================================================
   PROJECT CONTAINER
   ========================================================= */

.project-container {
    width: min(94vw, 1550px);
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
    text-align: center;
    padding: clamp(20px, 4vh, 60px) 0;
}


/* =========================================================
   PROJECT HEADER
   ========================================================= */

.project-header {
    width: min(94vw, 1550px);
    max-width: 100%;
    text-align: center;
}


/* =========================================================
   PROJECT TITLE
   ========================================================= */

.project-title {
    margin: 0;
    padding: 0;
    width: 100%;
    font-size: clamp(
    1.7rem,
    max(2.2vw, 4.5vh),
    2.8rem
);
    font-weight: 500;
    letter-spacing: 0.5px;
    text-align: center;
    white-space: nowrap;
    transform: translateY(-20px);
        width: min(90vw, 1500px);
    max-width: 1500px;
    margin-left: auto;
    margin-right: auto;

    white-space: normal;
    overflow-wrap: break-word;
    text-align: center;

    
}


/* =========================================================
   PROJECT SKILLS
   ========================================================= */

.project-skills {

    width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;

    gap: 7px;

    margin: 4px 0 0;

    padding: 0;

    transform: translateY(-10px);

}


/* =========================================================
   INDIVIDUAL SKILL
   ========================================================= */

.skill-tag {

    --skill-color: #888888;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding:
        5px
        10px;

    border:
        1px
        solid
        var(--skill-color);

    border-radius: 6px;

    background:
        color-mix(
            in srgb,
            var(--skill-color) 16%,
            transparent
        );

    color: #d8d8d8;

    font-size: clamp(
        0.75rem,
        max(0.85vw, 1.25vh),
        0.95rem
    );

    line-height: 1;

    white-space: nowrap;

    transition:
        transform 0.2s ease,
        background 0.2s ease;

}

/* =========================================================
   PROJECT INFO
   ========================================================= */

.project-info {
    width: min(90vw, 1550px);
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(25px, 2.5vw, 45px);
    align-items: start;
    text-align: left;
}

/* =========================================================
   PROJECT DESCRIPTION
   ========================================================= */
.project-description {
    margin: 0;
    padding: 0;
    width: 100%;
    font-size: clamp(1rem, 1.35rem + 0.5vh, 1.5rem);
    line-height: 1.65;
    color: #b0b0b0;
    text-align: center;
}

.desc-left, .desc-right {
    width: 100%; max-width: 680px;
}

.desc-quote {
    font-size: clamp(1.05rem, 1.15rem + 0.35vh, 1.3rem);
    font-style: italic;
    line-height: 1.55;
    margin-bottom: clamp(15px, 2vh, 25px);
    text-align: justify;
}

.desc-paragraph {
    font-size: clamp(0.95rem, 1rem + 0.3vh, 1.15rem);
    line-height: 1.55;
    text-align: justify;
}

.desc-title {
    font-size: clamp(1.1rem, 1.2rem + 0.3vh, 1.4rem);
    font-weight: 600;
    margin-bottom: clamp(10px, 1.5vh, 18px);
    text-align: left;
}

.desc-list {
    list-style: disc;
    padding-left: 20px;
}

.desc-list li {
    margin-bottom: clamp(8px, 1.2vh, 14px);
    font-size: clamp(0.95rem, 1rem + 0.25vh, 1.15rem);
    line-height: 1.5;
    text-align: justify;
}


/* =========================================================
   PROJECT GALLERY
========================================================= */

.project-gallery {
    width: 100%;

    margin: 0;

    align-self: start;
}

        /* =========================================================
           COVERFLOW CAROUSEL
        ========================================================= */

.carousel-wrapper {
    --gallery-size: clamp(
        300px,
    min(43vw, 58vh),
    580px
    );

    position: relative;
    width: 100%;
    height: calc(var(--gallery-size) * 0.56);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: visible;
    touch-action: none;
}

.carousel-stage {
    position: relative;
    width: 100%;
    height: calc(var(--gallery-size) * 0.56);
}


        /* =========================================================
           SLIDES
        ========================================================= */

        .carousel-slide {

            position: absolute;

            top: 50%;
            left: 50%;

width: var(--gallery-size);
height: calc(var(--gallery-size) * 0.56);

            background: #111111;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;

            transform-origin: center center;

            cursor: pointer;

            transition:

                transform 0.55s
                cubic-bezier(
                    0.77,
                    0,
                    0.175,
                    1
                ),

                opacity 0.55s
                ease,

                filter 0.55s
                ease;

        }


        /* =========================================================
           CENTER SLIDE
        ========================================================= */

        .carousel-slide.center {

            transform:
                translate(
                    -50%,
                    -50%
                )
                scale(1);

            opacity: 1;

            z-index: 5;

            filter:
                brightness(1);

            cursor: default;

        }


        /* =========================================================
           PREVIOUS SLIDE
        ========================================================= */

.carousel-slide.previous {
    transform:
        translate(
            calc(-50% - 75%),
            -50%
        )
        scale(0.7);
    opacity: 0.45;
    z-index: 3;
    filter:
        brightness(0.6);
}


        /* =========================================================
           NEXT SLIDE
        ========================================================= */

.carousel-slide.next {
    transform:
        translate(
            calc(-50% + 75%),
            -50%
        )
        scale(0.7);
    opacity: 0.45;
    z-index: 3;
    filter:
        brightness(0.6);
}


        /* =========================================================
           FAR SLIDES
        ========================================================= */

        .carousel-slide.hidden-left {

            transform: translate(calc(-50% - 45%), -50%) scale(0.5);

            opacity: 0;

            z-index: 1;

        }


        .carousel-slide.hidden-right {

            transform: translate(calc(-50% + 45%), -50%) scale(0.5);

            opacity: 0;

            z-index: 1;

        }


        /* =========================================================
           PLACEHOLDER CONTENT
        ========================================================= */

        .placeholder {

            width: 100%;
            height: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #111111,
                    #222222
                );

            color: #777777;

            font-size: 28px;

            letter-spacing: 2px;

        }


        /* =========================================================
           REAL IMAGES
        ========================================================= */

        .carousel-slide img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

        }


        /* =========================================================
           VIDEOS
        ========================================================= */

        .carousel-slide video {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

        }


        /* =========================================================
           ARROWS
        ========================================================= */

        .carousel-button {

            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            z-index: 20;

            width: 48px;
            height: 48px;

            border: none;

            background:transparent;

            color: #ffffff;

            font-size: 25px;

            cursor: pointer;

            display: flex;

            justify-content: center;
            align-items: center;

            transition:

                background 0.2s ease,

                opacity 0.2s ease;

        }


        .carousel-button:hover {

            background:transparent;

        }


        .carousel-button.prev {

            left: 15px;

        }


        .carousel-button.next {

            right: 15px;

        }


        /* =========================================================
           DOTS
        ========================================================= */

        .carousel-dots {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            margin-top: 14px;

        }


        .carousel-dot {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #444444;

            cursor: pointer;

            transition:

                transform 0.25s ease,

                background 0.25s ease;

        }


        .carousel-dot.active {

            background: #ffffff;

            transform:
                scale(1.35);

        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 1100px) {


#typing-role {
    font-size: 1em;
}


            #typing-name {

                font-size: 2.5em;

            }


            #typing-subtitle {

                font-size: 1.15em;

            }


#typing-quote {
    font-size: 1em;
}

            .carousel-wrapper {

                height:
                    min(
                        320px,
                        calc(
                            (100vw - 80px)
                            * 0.5625
                        )
                    );

            }


            .carousel-stage {

                height:
                    min(
                        320px,
                        calc(
                            (100vw - 80px)
                            * 0.5625
                        )
                    );

            }


            .carousel-slide {

                width:
                    min(
                        570px,
                        calc(
                            100vw - 80px
                        )
                    );

                height:
                    min(
                        320px,
                        calc(
                            (100vw - 80px)
                            * 0.5625
                        )
                    );

            }


            .carousel-slide.previous {

                transform:
                    translate(
                        calc(-50% - 330px),
                        -50%
                    )
                    scale(0.6);

            }


            .carousel-slide.next {

                transform:
                    translate(
                        calc(-50% + 330px),
                        -50%
                    )
                    scale(0.6);

            }

        }


        @media (max-width: 700px) {


            #intro-content {

                padding: 20px;

            }

#typing-role {
    font-size: 0.9em;
    letter-spacing: 2px;
}

            #typing-name {

                font-size: 1.8em;

            }


            #typing-subtitle {

                font-size: 0.95em;

            }

#typing-quote {
    font-size: 0.9em;
}

            .portfolio-section {

                padding:
                    40px 20px 60px;

            }


            .project-title {

                font-size: clamp(1.8rem, 3vw, 3.5rem);

            }

.project-skills {

    margin-bottom: 15px;

}

.skill-tag {

    font-size: clamp(
        0.75rem,
        1.4vw,
        0.95rem
    );

}

            .carousel-wrapper {

                height:
                    calc(
                        (100vw - 40px)
                        * 0.5625
                    );

            }


            .carousel-stage {

                height:
                    calc(
                        (100vw - 40px)
                        * 0.5625
                    );

            }


            .carousel-slide {

                width:
                    calc(
                        100vw - 40px
                    );

                height:
                    calc(
                        (100vw - 40px)
                        * 0.5625
                    );

            }


            .carousel-slide.previous {

                transform:
                    translate(
                        calc(-50% - 220px),
                        -50%
                    )
                    scale(0.55);

                opacity: 0.3;

            }


            .carousel-slide.next {

                transform:
                    translate(
                        calc(-50% + 220px),
                        -50%
                    )
                    scale(0.55);

                opacity: 0.3;

            }


            .carousel-button {

                width: 40px;
                height: 40px;

                font-size: 20px;

            }


            .project-description {

                font-size: 0.9em;

            }

        }

        @media (max-width: 900px) {
    .project-info {
        grid-template-columns: 1fr;
        gap: 20px;
    }
}

/* =========================================================
   OUTRO / CONTACT
   ========================================================= */

.outro-section {
    background: #000;
}

.outro-section .section-background {
    display: none;
}

.outro-content {
    position: relative;

    width: 100%;
    height: 100%;

    box-sizing: border-box;

    padding: 8vh 8vw;

    color: #fff;
}

.outro-title {
    position: absolute;

    top: 12%;
    right: 8%;

    font-size: clamp(2rem, 4vw, 4rem);

    font-weight: 600;

    letter-spacing: 0.08em;

    text-transform: uppercase;
}

.outro-contact {
    position: absolute;

    left: 8%;
    bottom: 10%;

    max-width: 600px;
}

.outro-heading {
    margin-bottom: 35px;

    font-size: clamp(1.3rem, 2vw, 2rem);

    letter-spacing: 0.08em;

    font-weight: 500;
}

.outro-info {
    display: flex;

    flex-direction: column;

    gap: 24px;
}

.outro-item {
    display: flex;

    flex-direction: column;

    gap: 5px;
}

.outro-label {
    font-size: 0.7rem;

    letter-spacing: 0.15em;

    opacity: 0.5;
}

.outro-value {
    font-size: clamp(0.9rem, 1.2vw, 1.1rem);
    white-space: pre-line;
    line-height: 1.5;
}

.outro-final-message {
    position: absolute;

    right: 8%;
    bottom: 10%;

    width: min(34vw, 480px);

    font-size: clamp(1rem, 1.4vw, 1.3rem);

    letter-spacing: 0.05em;

    opacity: 0.7;
}

.outro-link {
    text-decoration: none;

    color: inherit;

    transition:
        opacity 0.2s ease;
}


.outro-link:hover {
    opacity: 0.55;
}

/* =========================================================
   OUTRO STORY CLOSING
   ========================================================= */

.outro-story-message,
.outro-story-final {

    opacity: 0;

}


.outro-story-final {

    margin-top: 12px;

    opacity: 0.7;

}

/* =========================================================
   OUTRO CONTACT FORM
   ========================================================= */

.outro-form {
    position: absolute;

    right: 8%;
    bottom: 10%;

    width: min(34vw, 480px);

    display: flex;
    flex-direction: column;

    gap: 22px;

    opacity: 0;
    transition: opacity 0.8s ease;
}

.outro-form.visible {
    opacity: 1;
}

.outro-form-field {
    display: flex;
    flex-direction: column;

    gap: 7px;
}


.outro-form-field label {
    font-size: 0.7rem;

    letter-spacing: 0.15em;

    opacity: 0.5;
}


.outro-form-field input,
.outro-form-field textarea {

    width: 100%;

    box-sizing: border-box;

    padding: 10px 0;

    border: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.35);

    background: transparent;

    color: #fff;

    font-family: inherit;

    font-size: 1rem;

    outline: none;

    resize: vertical;
}


.outro-form-field input:focus,
.outro-form-field textarea:focus {

    border-bottom-color: #fff;

}


#contact-submit {

    align-self: flex-start;

    margin-top: 5px;

    padding: 9px 18px;

    border: 1px solid rgba(255, 255, 255, 0.5);

    background: transparent;

    color: #fff;

    font-family: inherit;

    font-size: 0.7rem;

    letter-spacing: 0.12em;

    cursor: pointer;

    transition:
        background 0.2s ease,
        color 0.2s ease;

}


#contact-submit:hover {

    background: #fff;

    color: #000;

}

const languages = [

    {
        code: "en",
        name: "English"
    },

    {
        code: "es",
        name: "Español"

        code: "ja",

    }

];


let currentLanguageIndex = 0;


const languageUp =
    document.getElementById("language-up");


const languageDown =
    document.getElementById("language-down");


const currentLanguageElement =
    document.getElementById("current-language");

    /* =========================================================
   RENDER SKILLS
========================================================= */

function renderSkills() {

    const languageCode =
        languages[currentLanguageIndex].code;


    document
        .querySelectorAll(".project-skills")
        .forEach(container => {

            const projectId =
                container.dataset.project;


            const projectSkillList =
                projectSkills[projectId];


            container.innerHTML = "";


            projectSkillList.forEach(skillId => {

                const skill =
                    skills[skillId];


                const tag =
                    document.createElement("span");


                tag.classList.add("skill-tag");


                tag.textContent =
                    skill.translations[languageCode];


                tag.style.setProperty(
                    "--skill-color",
                    skill.color
                );


                container.appendChild(tag);

            });

        });

}

function updateLanguage() {

    const language =
        languages[currentLanguageIndex];


    currentLanguageElement.textContent =
        language.name;


    const languageData =
        translations[language.code];


    /* =====================================================
       INTRO
    ===================================================== */

    role =
        languageData.role;

    name =
        languageData.name;

    subtitle =
        languageData.subtitle;

    quote =
        languageData.quote;


    /* =====================================================
       PROJECT TEXTS
    ===================================================== */

    document
        .querySelectorAll("[data-translation]")
        .forEach(element => {

            const key =
                element.dataset.translation;

            if (languageData[key]) {

                element.textContent =
                    languageData[key];

            }

        });


    /* =====================================================
       IF INTRO HAS NOT STARTED
    ===================================================== */

    if (!typingStarted) {

        titleElement.innerHTML =
            "";

        subtitleElement.innerHTML =
            "";

        quoteElement.innerHTML =
            "";

    }


    /* =====================================================
       IF INTRO HAS ALREADY FINISHED
    ===================================================== */

    if (typingFinished) {

        roleElement.textContent =
            role;

        titleElement.textContent =
            name;

        subtitleElement.textContent =
            subtitle;

        quoteElement.textContent =
            quote;

    }

setTimeout(() => {

    if (outroTypingFinished) {
        updateOutroTranslations();
    }

}, 0);

renderSkills();

}

languageUp.addEventListener(
    "click",
    () => {

        currentLanguageIndex--;

        if (currentLanguageIndex < 0) {

            currentLanguageIndex =
                languages.length - 1;

        }

        updateLanguage();

    }
);


languageDown.addEventListener(
    "click",
    () => {

        currentLanguageIndex++;

        if (
            currentLanguageIndex >=
            languages.length
        ) {

            currentLanguageIndex = 0;

        }

        updateLanguage();

    }
);

/* =========================================================
   TYPEWRITER INDIVIDUAL
   ========================================================= */

function typeOutroText(
    element,
    text,
    speed = 45
) {

    return new Promise(resolve => {

        /*
         * Si se pidió SKIP,
         * escribimos directamente.
         */
        if (outroSkipRequested) {

            element.textContent = text;

            resolve();

            return;
        }


        outroTypingResolve = resolve;

        element.textContent = "";

        let index = 0;


        function typeCharacter() {

            /*
             * SKIP DURANTE LA ESCRITURA
             */
            if (outroSkipRequested) {

                element.textContent = text;

                outroTypingResolve = null;

                resolve();

                return;
            }


            if (index >= text.length) {

                outroTypingResolve = null;

                resolve();

                return;
            }


            element.textContent += text[index];


            /*
             * Sonido de máquina de escribir.
             */
            if (
                typeSound &&
                text[index] !== " "
            ) {

                typeSound.currentTime = 0;

                typeSound.play()
                    .catch(() => {});

            }


            index++;


            const currentSpeed =
                outroMouseHeld
                    ? fastSpeed
                    : speed;


            outroTypingTimeout =
                setTimeout(
                    typeCharacter,
                    currentSpeed
                );

        }


        typeCharacter();

    });

}

   FINISH OUTRO IMMEDIATELY
========================================================= */

function finishOutroImmediately() {

    /*
     * Si ya terminó,

/* =========================================================
   SECTION AUDIO
   ========================================================= */

const sectionAudios = verticalSections.map(section =>
    section.querySelector(".section-audio")
);

const AUDIO_FADE_TIME = 800;

let audioUserVolume = 1;
let previousAudioVolume = 1;

let audioUnlocked = false;

let audioTransitionId = 0;

const audioFadeLevels = new WeakMap();

function fadeAudio(
    audio,
    targetLevel,
    duration,
    pauseWhenFinished = false,
    transitionId = audioTransitionId
) {

    if (!audio) return;

    const startLevel =
        audioFadeLevels.get(audio) ?? 1;

    const difference =
        targetLevel - startLevel;

    const startTime =
        performance.now();

    audioFadeLevels.set(
        audio,
        startLevel
    );


    function update() {

        /*
         * Si comenzó una nueva transición,
         * este fade ya no tiene autoridad.
         */
        if (
            transitionId !==
            audioTransitionId
        ) {
            return;
        }


        const elapsed =
            performance.now() - startTime;

        const progress =
            Math.min(
                elapsed / duration,
                1
            );


        const currentLevel =
            startLevel +
            difference * progress;


        audioFadeLevels.set(
            audio,
            currentLevel
        );


        /*
         * El volumen audible es:
         *
         * nivel del fade × volumen del usuario
         */
        audio.volume =
            currentLevel *
            audioUserVolume;


        if (progress < 1) {

            requestAnimationFrame(
                update
            );

        } else {

            audioFadeLevels.set(
                audio,
                targetLevel
            );

            audio.volume =
                targetLevel *
                audioUserVolume;


            if (
                targetLevel === 0 &&
                pauseWhenFinished
            ) {

                audio.pause();
                audio.currentTime = 0;

            }

        }
    }


    requestAnimationFrame(update);
}

function unlockAudio() {

    if (audioUnlocked) {
        return;
    }

    const introAudio = sectionAudios[0];

    if (!introAudio) {
        return;
    }

    introAudio.muted = true;

    introAudio.play()
        .then(() => {

            introAudio.pause();
            introAudio.currentTime = 0;
            introAudio.muted = false;

            audioUnlocked = true;

        })
        .catch(() => {

            // El navegador todavía no permitió reproducir audio.

        });

}

function changeSectionAudio(newIndex) {

    audioTransitionId++;

    const transitionId =
        audioTransitionId;


    /*
     * Apagamos todos los audios
     * que no pertenecen a la nueva sección.
     */
    sectionAudios.forEach(
        (audio, index) => {

            if (!audio) return;

            if (index !== newIndex) {

                fadeAudio(
                    audio,
                    0,
                    AUDIO_FADE_TIME,
                    true,
                    transitionId
                );

            }

        }
    );


    const newAudio =
        sectionAudios[newIndex];

    if (!newAudio) return;


    /*
     * El nuevo audio empieza
     * SIEMPRE desde el principio.
     */
    newAudio.currentTime = 0;

    audioFadeLevels.set(
        newAudio,
        0
    );

    newAudio.volume = 0;


    /*
     * El audio comienza aunque
     * el usuario esté muteado.
     */
    newAudio.play().catch(() => {});


    /*
     * Fade IN.
     */
    requestAnimationFrame(() => {

        if (
            transitionId !==
            audioTransitionId
        ) {
            return;
        }

        fadeAudio(
            newAudio,
            1,
            AUDIO_FADE_TIME,
            false,
            transitionId
        );

    });

}

/* =========================================================
   AUDIO SETTINGS FOR USER
========================================================= */

const audioToggle =
    document.getElementById("audio-toggle");

const audioVolume =
    document.getElementById("audio-volume");


/* =========================================================
   VOLUME CONTROL
========================================================= */

audioVolume.addEventListener(
    "input",
    () => {

        audioUserVolume =
            Number(
                audioVolume.value
            );


        if (audioUserVolume > 0) {

            previousAudioVolume =
                audioUserVolume;

        }


        /*
         * Actualizamos solamente
         * el volumen audible.
         *
         * NO tocamos play/pause.
         * NO tocamos currentTime.
         */
        sectionAudios.forEach(
            audio => {

                if (!audio) return;

                const fadeLevel =
                    audioFadeLevels.get(
                        audio
                    ) ?? 0;

                audio.volume =
                    fadeLevel *
                    audioUserVolume;

            }
        );


        if (audioUserVolume === 0) {

            audioToggle.textContent =
                "🔇";

        } else {

            audioToggle.textContent =
                "🔊";

        }

    }
);


/* =========================================================
   MUTE / UNMUTE
========================================================= */

audioToggle.addEventListener(
    "click",
    () => {

        /*
         * DESMUTE
         */
        if (audioUserVolume === 0) {

            audioUserVolume =
                previousAudioVolume;


            audioVolume.value =
                audioUserVolume;


            sectionAudios.forEach(
                audio => {

                    if (!audio) return;

                    const fadeLevel =
                        audioFadeLevels.get(
                            audio
                        ) ?? 0;

                    audio.volume =
                        fadeLevel *
                        audioUserVolume;

                }
            );


            audioToggle.textContent =
                "🔊";

            return;
        }


        /*
         * MUTE
         */

        previousAudioVolume =
            audioUserVolume;

        audioUserVolume = 0;

        audioVolume.value = 0;


        sectionAudios.forEach(
            audio => {

                if (!audio) return;

                audio.volume = 0;

            }
        );


        audioToggle.textContent =
            "🔇";

    }
);


/* =========================================================
   PREPARAR ESTADO INICIAL
   ========================================================= */

function setInitialVerticalState() {

    verticalSections.forEach(
        section => {

            section.classList.remove(
                "vertical-current",
                "vertical-exit-up",
                "vertical-exit-down",
                "vertical-enter-top",
                "vertical-enter-bottom"
            );

            section.style.transform = "";
            section.style.opacity = "";
            section.style.zIndex = "";

        }
    );


    /*
     * La INTRO es el primer elemento.
     */

    verticalSections[0].classList.add(
        "vertical-current"
    );
}


/* =========================================================
   CAMBIAR DE SECCIÓN
   ========================================================= */

function clearStates(element) {

    element.classList.remove(
        "vertical-current",
        "vertical-exit-up",
        "vertical-exit-down",
        "vertical-enter-top",
        "vertical-enter-bottom",
        "vertical-no-transition"
    );
}

function showVerticalSection(newIndex) {

    /*
     * =====================================================
     * VALIDACIONES
     * =====================================================
     */

    if (
        newIndex < 0 ||
        newIndex >= verticalSections.length
    ) {
        return;
    }

    if (newIndex === currentSection) {
        return;
    }

    if (verticalLocked) {
        return;
    }


    /*
     * =====================================================
     * BLOQUEAMOS LA TRANSICIÓN
     * =====================================================
     */

    verticalLocked = true;


    /*
     * =====================================================
     * IDENTIFICAMOS CURRENT Y TARGET
     * =====================================================
     */

    const current =
        verticalSections[currentSection];

    const target =
        verticalSections[newIndex];


    /*
     * =====================================================
     * DETERMINAMOS DIRECCIÓN
     * =====================================================
     *
     * newIndex > currentSection
     * → estamos bajando
     *
     * newIndex < currentSection
     * → estamos subiendo
     */

    const movingDown =
        newIndex > currentSection;


    /*
     * =====================================================
     * LIMPIAMOS ESTADOS ANTERIORES
     * =====================================================
     */

    clearStates(current);
    clearStates(target);


    /*
     * =====================================================
     * PREPARAMOS EL TARGET
     *
     * IMPORTANTE:
     *
     * Lo hacemos SIN transición.
     *
     * Así evitamos que el target pase
     * visualmente de +100% a -100%.
     * =====================================================
     */

    target.classList.add(
        "vertical-no-transition"
    );


    if (movingDown) {

        /*
         * BAJAMOS:
         *
         * P1 → P2
         *
         * P2 tiene que empezar ABAJO.
         */

        target.classList.add(
            "vertical-enter-bottom"
        );

    } else {

        /*
         * SUBIMOS:
         *
         * P2 → P1
         *
         * P1 tiene que empezar ARRIBA.
         */

        target.classList.add(
            "vertical-enter-top"
        );
    }


    /*
     * =====================================================
     * FORZAMOS AL NAVEGADOR A APLICAR
     * ESA POSICIÓN INICIAL.
     * =====================================================
     */

    target.offsetHeight;


    /*
     * =====================================================
     * AHORA PREPARAMOS LA SALIDA
     * DEL ELEMENTO ACTUAL.
     * =====================================================
     */

    if (movingDown) {

        current.classList.add(
            "vertical-exit-up"
        );

    } else {

        current.classList.add(
            "vertical-exit-down"
        );
    }


    /*
     * =====================================================
     * ACTUALIZAMOS EL ÍNDICE
     * =====================================================
     */

    currentSection = newIndex;

    changeSectionAudio(currentSection);
    /*
     * =====================================================
     * SIGUIENTE FRAME
     *
     * Quitamos "no-transition".
     *
     * Ahora sí empieza la animación.
     * =====================================================
     */

    requestAnimationFrame(() => {

        target.classList.remove(
            "vertical-no-transition",
            "vertical-enter-top",
            "vertical-enter-bottom"
        );

        target.classList.add(
            "vertical-current"
        );

    });


    /*
     * =====================================================
     * FINAL DE LA ANIMACIÓN
     * =====================================================
     */

    setTimeout(() => {

        /*
         * Limpiamos todos los estados.
         */

        verticalSections.forEach(
            (section, index) => {

                clearStates(section);

                /*
                 * Solo el elemento actual
                 * queda visible.
                 */

                if (
                    index === currentSection
                ) {

                    section.classList.add(
                        "vertical-current"
                    );

                    /*
 * Si la sección actual es la OUTRO,
 * iniciamos su máquina de escribir.
 */

if (
    section.id === "outro"
) {

    startOutroTyping();

}

                }

            }
        );


        /*
         * Liberamos el bloqueo.
         */

        verticalLocked = false;

    }, ANIM_TIME);
}

/* =========================================================
   TOUCH PAD CELULAR & MOUSE WHEEL
   ========================================================= */

let touchStartX = 0;
let touchStartY = 0;
let touchTarget = null;

const SWIPE_THRESHOLD = 50;

let lastTapTime = 0;
const DOUBLE_TAP_DELAY = 350;
   
let wheelCooldown = false;

let wheelCooldownTimer = null;

intro.addEventListener("touchstart", (event) => {

    unlockAudio();

    if (typingFinished) {
        return;
    }

    const now = Date.now();

    if (now - lastTapTime < DOUBLE_TAP_DELAY) {
        finishTypingImmediately();
        lastTapTime = 0;
        return;
    }

    lastTapTime = now;

    mouseHeld = true;

    if (!typingStarted) {
        startTyping();
    }

});

intro.addEventListener("touchend", () => {

    if (typingFinished) {
        return;
    }

    mouseHeld = false;

});

window.addEventListener("touchstart", (event) => {

    unlockAudio();

    if (!typingFinished) {
        return;
    }

        if (event.target.closest("#audio-control")) {
        return;
    }

    const touch = event.touches[0];

    touchStartX = touch.clientX;
    touchStartY = touch.clientY;

    touchTarget = event.target;

});

window.addEventListener("touchend", (event) => {

    if (!typingFinished) {
        return;
    }

        if (event.target.closest("#audio-control")) {
        return;
    }

    const touch = event.changedTouches[0];

    const deltaX = touch.clientX - touchStartX;
    const deltaY = touch.clientY - touchStartY;

    const absX = Math.abs(deltaX);
    const absY = Math.abs(deltaY);

    if (Math.max(absX, absY) < SWIPE_THRESHOLD) {
        return;
    }

    /*
     * SWIPE HORIZONTAL
     */
    if (absX > absY) {

        const carousel = touchTarget.closest(".carousel-wrapper");

        if (!carousel) {
            return;
        }

        const section = carousel.closest(".portfolio-section");

        if (!section) {
            return;
        }

        const carouselIndex =
            Array.from(projects).indexOf(section);

        if (carouselIndex === -1) {
            return;
        }

        if (deltaX < 0) {

            // Swipe hacia la izquierda → siguiente imagen
            moveCarousel(carouselIndex, 1);

        } else {

            // Swipe hacia la derecha → imagen anterior
            moveCarousel(carouselIndex, -1);

        }

        return;
    }

    /*
     * SWIPE VERTICAL
     */
    if (deltaY < 0) {

        // Swipe hacia arriba → siguiente sección
        showVerticalSection(currentSection + 1);

    } else {

        // Swipe hacia abajo → sección anterior
        showVerticalSection(currentSection - 1);

    }

});


window.addEventListener(
    "wheel",
    (event) => {

        if (!typingFinished) {
            return;
        }

        event.preventDefault();

        if (
            verticalLocked ||
            wheelCooldown
        ) {
            return;
        }

        if (event.deltaY > 0) {

            showVerticalSection(
                currentSection + 1
            );

        }

        else if (event.deltaY < 0) {

            showVerticalSection(
                currentSection - 1
            );

        }

        else {
            return;
        }


        /*
         * Bloqueamos el resto del gesto
         */

        wheelCooldown = true;

        clearTimeout(
            wheelCooldownTimer
        );

        wheelCooldownTimer = setTimeout(
            () => {

                wheelCooldown = false;

            },
            1000
        );

    },
    {
        passive: false
    }
);

/* =========================================================
   KEYBOARD
   ========================================================= */

window.addEventListener(
    "keydown",
    (event) => {

        if (!typingFinished) {
            return;
        }


        if (
            event.key === "ArrowDown" ||
            event.key === "PageDown"
        ) {

            showVerticalSection(
                currentSection + 1);
        }


        if (
            event.key === "ArrowUp" ||
            event.key === "PageUp"
        ) {

            showVerticalSection(
                currentSection - 1);
        }

    }
);


/* =========================================================
   INITIAL STATE
   ========================================================= */

setInitialVerticalState();

        /* =========================================================
           HORIZONTAL CAROUSELS
        ========================================================= */

        const carouselIndexes = [

            0,
            0,
            0

        ];



        /* =========================================================
           UPDATE COVERFLOW
        ========================================================= */

        function updateCarousel(
            carouselIndex
        ) {


            const section =
                projects[
                    carouselIndex
                ];


            const slides =
                section.querySelectorAll(
                    ".carousel-slide"
                );


            const total =
                slides.length;


            const currentIndex =
                carouselIndexes[
                    carouselIndex
                ];



            slides.forEach(
                (slide, index) => {


                    slide.classList.remove(
                        "center",
                        "previous",
                        "next",
                        "hidden-left",
                        "hidden-right"
                    );



                    if (
                        index === currentIndex
                    ) {


                        slide.classList.add(
                            "center"
                        );


                    }


                    else if (
                        index ===
                        getWrappedIndex(
                            currentIndex - 1,
                            total
                        )
                    ) {


                        slide.classList.add(
                            "previous"
                        );


                    }


                    else if (
                        index ===
                        getWrappedIndex(
                            currentIndex + 1,
                            total
                        )
                    ) {


                        slide.classList.add(
                            "next"
                        );


                    }


                    else if (
                        isBefore(
                            index,
                            currentIndex,
                            total
                        )
                    ) {


                        slide.classList.add(
                            "hidden-left"
                        );


                    }


                    else {


                        slide.classList.add(
                            "hidden-right"
                        );


                    }

                }
            );



            /* Update dots */

            const dots =
                section.querySelectorAll(
                    ".carousel-dot"
                );


            dots.forEach(
                (dot, index) => {

                    dot.classList.toggle(
                        "active",
                        index === currentIndex
                    );

                }
            );

        }



        /* =========================================================
           WRAPPED INDEX
        ========================================================= */

        function getWrappedIndex(
            index,
            total
        ) {


            return (
                (
                    index
                    %
                    total
                )
                +
                total
            )
            %
            total;

        }



        /* =========================================================
           DETERMINE SIDE
        ========================================================= */

        function isBefore(
            index,
            current,
            total
        ) {


            const difference =
                (
                    index
                    -
                    current
                    +
                    total
                )
                %
                total;


            return (
                difference >
                total / 2
            );

        }



        /* =========================================================
           MOVE CAROUSEL
        ========================================================= */

        function moveCarousel(
            carouselIndex,
            direction
        ) {


            const section =
                projects[
                    carouselIndex
                ];


            const slides =
                section.querySelectorAll(
                    ".carousel-slide"
                );


            const total =
                slides.length;


            carouselIndexes[
                carouselIndex
            ] =

                getWrappedIndex(
                    carouselIndexes[
                        carouselIndex
                    ]
                    +
                    direction,
                    total
                );


            updateCarousel(
                carouselIndex
            );

        }



        /* =========================================================
           SELECT SLIDE
        ========================================================= */

        function selectSlide(
            carouselIndex,
            slideIndex
        ) {


            carouselIndexes[
                carouselIndex
            ] = slideIndex;


            updateCarousel(
                carouselIndex
            );

        }



        /* =========================================================
           INITIALIZE CAROUSELS
        ========================================================= */

        updateCarousel(0);

        updateCarousel(1);

        updateCarousel(2);

        /* =========================================================
          SONIDO CLICKS
        ========================================================= */

const arrowSound = document.getElementById("arrow-sound");
const arrowSoundP2 = document.getElementById("arrow-sound-p2");

function pressArrow(imgElement, normalSrc, pressedSrc) {

    imgElement.src = pressedSrc;

    let soundToPlay = arrowSound;

    // Si la flecha pertenece al Proyecto 2
    if (
        imgElement.id === "arrowP2-prev-img" ||
        imgElement.id === "arrowP2-next-img"
    ) {
        soundToPlay = arrowSoundP2;
    }

    soundToPlay.currentTime = 0;
    soundToPlay.play().catch(() => {});

    setTimeout(() => {
        imgElement.src = normalSrc;
    }, 150);

}
